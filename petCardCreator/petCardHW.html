<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pet Gallery</title>
  <link rel="stylesheet" href="petCardHW-1.css">
  <script src="petCardHW.js"></script>
</head>
<body>

  <h1 id="galleryHeading">Pet Gallery</h1>

  <div class="galleryContainer">
    <img id="PetImage" src="" alt="Pet image">

    <dl class="petDetails">
      <dt>Name:</dt>
      <dd id="petName"></dd>

      <dt>Details:</dt>
      <dd id="petType"></dd>
        
      <dt>Owner:</dt>
      <dd id="petOwner"></dd>
      
      <dt>Owner's Phone Number:</dt>
      <dd id="OwnerPhone"></dd>
      
      <dt>ID:</dt>
      <dd id="petID"></dd>
      <!--Finish the <dt> and <dd> tags for the Details, Owner, Owner Phone, petID-->
    </dl>
  </div>

  <div class="buttons">
    <button id="prev">Previous</button>
    <button id="next">Next</button>
  </div>

</body>
</html>
